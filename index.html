<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>码间 · 打印实验台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:#192e25;font:16px/1.65 system-ui,sans-serif}
main{max-width:850px;margin:auto;padding:48px 22px}header{border-bottom:1px solid #cbd5cc;padding-bottom:24px}h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.15;margin:.3rem 0}h2{margin:0 0 .6rem}section{background:white;border:1px solid #d3ddd4;border-radius:16px;padding:22px;margin:18px 0}a,button{color:#155340}button,.button{border:0;border-radius:8px;background:#155340;color:white;padding:.65rem 1rem;font:inherit;text-decoration:none;display:inline-block;cursor:pointer}button:disabled{opacity:.45;cursor:default}input{font:inherit;max-width:100%}#drop{border:2px dashed #83a797;padding:1rem;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<main><header><strong>码间 / PRINT LAB</strong><h1>打印实验台</h1><p>下载样张、打印拍摄，再在浏览器里读取公共条码。照片和视频留在当前设备。</p></header>
<section><h2>下载与打印</h2><p>以 A4 实际大小 100% 打印，用直尺核对 100 mm 标线。拍摄时保留条码全高和左右白边，避免反光。公开练习页含普通 EAN-13 和 QR 样本。</p><a class="button" href="sample.svg" download>下载 A4 练习样张</a> <a class="button" href="catalog.html">浏览 256 个条码</a></section>
<section><h2>读码</h2><p>选择或拖入照片、短视频。每次只拍一个条码，建议使用 PNG、JPEG 或 MP4。</p><div id="drop"><input id="file" type="file" accept="image/*,video/*"></div><p id="status" role="status">等待文件</p><pre id="result"></pre><button id="save" disabled>下载读取记录</button></section>
<section><h2>隐藏水印</h2><p>公开练习页只用于普通条码。已有的旧版兼容样张可以在原工作台读取隐藏载荷。</p><a href="https://jr-taco.github.io/barcode-scanner/">打开旧版「码间」读取器</a></section></main>
<script>
const file=document.querySelector('#file'), status=document.querySelector('#status'), result=document.querySelector('#result'), save=document.querySelector('#save'), drop=document.querySelector('#drop');
let record, busy=false;
function event(el,name){return new Promise((resolve,reject)=>{const done=()=>{clearTimeout(timer);el.removeEventListener(name,done);el.removeEventListener('error',bad);resolve()};const bad=()=>{clearTimeout(timer);el.removeEventListener(name,done);el.removeEventListener('error',bad);reject(Error('浏览器无法读取该文件'))};const timer=setTimeout(bad,8000);el.addEventListener(name,done);el.addEventListener('error',bad);})}
async function read(f){
 if(!f||busy)return;
 if(!('BarcodeDetector' in window)){status.textContent='此浏览器不支持页面内扫码，请使用下方的旧版读取器。';return;}
 busy=true;save.disabled=true;result.textContent='';status.textContent='正在读取…';
 let url,video,image;
 try{
  const scanner=new BarcodeDetector(), found=new Map();
  const scan=async source=>{for(const {format,rawValue} of await scanner.detect(source))found.set(format+'\0'+rawValue,{format,value:rawValue});};
  if(f.type.startsWith('video/')||/\.(mp4|mov|m4v|webm)$/i.test(f.name)){
   url=URL.createObjectURL(f);video=document.createElement('video');video.muted=true;video.preload='auto';
   const ready=event(video,'loadeddata');video.src=url;await ready;
   const duration=Math.min(video.duration,30);
   if(!Number.isFinite(duration)||duration<=0)throw Error('无法确认视频时长，请转为 MP4 后重试。');
   for(let i=0;i<12;i++){const t=(i+.5)*duration/12;if(Math.abs(video.currentTime-t)>0.001){const seek=event(video,'seeked');video.currentTime=t;await seek;}await scan(video);}
  }else{image=await createImageBitmap(f);await scan(image);}
  const codes=[...found.values()];
  record={file:f.name,created_at:new Date().toISOString(),status:codes.length?'read':'no_read',codes};
  status.textContent=codes.length?'读取完成':'未读到公共条码';
  result.textContent=codes.map(x=>x.format+'  '+x.value).join('\n');save.disabled=false;
 }catch(e){status.textContent=e.message||'读取失败';}
 finally{image?.close();if(video)video.removeAttribute('src');if(url)URL.revokeObjectURL(url);busy=false;}
}
file.onchange=()=>read(file.files[0]);
drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();read(e.dataTransfer.files[0]);};
save.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));a.download='scan-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
</script></html>
